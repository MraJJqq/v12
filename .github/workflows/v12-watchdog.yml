name: V12 Scan Watchdog
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: v12-bitget-scan
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.V12_ENABLED == 'true' && vars.V12_LAUNCH_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Detect missed V12 scans and dispatch recovery
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V12_BARK_KEY: ${{ secrets.V12_BARK_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -c "from v12.watchdog import main; raise SystemExit(main())"
      - name: Persist Bark notification state
        if: always() && steps.monitor.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in v12/.bark-notification-state.json v12/.bark-watchdog-notification-state.json v12/.bark-pending-notification-state.json; do test ! -f "$file" || git add -f "$file"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(v12): persist watchdog Bark state"
          for attempt in 1 2 3; do git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0; done
          exit 1
