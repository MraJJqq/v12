name: V12 Scan Watchdog
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: v12-scan-watchdog
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.V12_ENABLED == 'true' && vars.V12_LAUNCH_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect missed V12 scans and dispatch recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V12_BARK_KEY: ${{ secrets.V12_BARK_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -c "from v12.watchdog import main; raise SystemExit(main())"
