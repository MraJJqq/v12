name: V12 Bark Pending Retry
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: v12-bitget-scan
  cancel-in-progress: false
jobs:
  retry:
    if: vars.V12_ENABLED == 'true' && vars.V12_LAUNCH_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard against active scan
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/workflows/v12-bitget-scan.yml/runs?per_page=10",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as r:runs=json.load(r).get("workflow_runs",[])
          active=any(x.get("status") in {"queued","in_progress"} for x in runs)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("skip="+("true" if active else "false")+"\n")
          PY
      - name: Retry pending Bark notification
        id: retry
        if: steps.guard.outputs.skip != 'true'
        env:
          V12_BARK_KEY: ${{ secrets.V12_BARK_KEY }}
        run: python -m v12.bark --retry-pending
      - name: Persist retry state
        if: always() && steps.retry.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in v12/.bark-notification-state.json v12/.bark-pending-notification-state.json; do test ! -f "$file" || git add -f "$file"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(v12): persist Bark retry state"
          for attempt in 1 2 3; do git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0; done
          exit 1
