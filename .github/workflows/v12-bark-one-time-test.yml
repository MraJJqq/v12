name: V12 Bark One-Time Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bark-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send exactly one Bark test notification
        env:
          V12_BARK_KEY: ${{ secrets.V12_BARK_KEY }}
        run: python -m v12.bark --test
